version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: freelancehub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: freelancehub_dev
    volumes:
      - mongodb_data:/data/db
    networks:
      - freelancehub-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: freelancehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - freelancehub-network

  # FreelanceHub Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancehub-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/freelancehub_dev?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: development-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: development-refresh-secret-change-in-production
      SESSION_SECRET: development-session-secret-change-in-production
    depends_on:
      - mongodb
      - redis
    networks:
      - freelancehub-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health/live', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  redis_data:

networks:
  freelancehub-network:
    driver: bridge